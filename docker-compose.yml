version: "3.8"
services:
  # ─────────────────────────────────────────────
  # 🚀 UltimateHealth Node.js API
  # ─────────────────────────────────────────────
  api:
    build: .
    container_name: ultimatehealth-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URL=mongodb://mongodb:27017/ultimate_health
      - KAFKA_BROKERS=kafka1:9092,kafka2:9092
      - KAFKAJS_NO_PARTITIONER_WARNING=1
    depends_on:
      mongodb:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    volumes:
      - .env:/usr/src/app/.env
      - ./ultimatehealth-firebase-adminsdk.json:/usr/src/app/ultimatehealth-firebase-adminsdk.json

  # ─────────────────────────────────────────────
  # 🍃 MongoDB Database
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: ultimatehealth-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # 📨 Kafka (2-Node KRaft mode for Fault Tolerance)
  # ─────────────────────────────────────────────
  kafka1:
    image: apache/kafka:latest
    container_name: kafka1-ultimatehealth
    restart: unless-stopped
    ports:
      - "9092:9092"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MAX_CONNECTIONS: 5000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka2:
    image: apache/kafka:latest
    container_name: kafka2-ultimatehealth
    restart: unless-stopped
    ports:
      - "9093:9092"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MAX_CONNECTIONS: 5000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ─────────────────────────────────────────────
  # 📦 PocketBase
  # ─────────────────────────────────────────────
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    container_name: ultimatehealth-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data

volumes:
  kafka1-data:
  kafka2-data:
  mongodb_data:
  pb_data:
