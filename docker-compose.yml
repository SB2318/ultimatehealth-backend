version : '3.8'
services:
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka-ultimatehealth
    ports:
      - "9092:9092"
    environment:
      # Tells the Bitnami image to use the modern KRaft mode instead of looking for a ZooKeeper server.
      KAFKA_ENABLED_KRAFT: 'true' 
      # The advertised host name is the host name that will be used by clients to connect to the Kafka broker. In this case, it is set to "kafka", which is the name of the Kafka service defined in this docker-compose file.
      KAFKA_ADVERTISED_HOST_NAME: kafka

      # In KRaft mode, the Kafka broker can take on multiple roles, including being a broker and a controller. The KAFKA_CFG_PROCESS_ROLES environment variable is used to specify the roles that the Kafka broker will take on. In this case, it is set to "broker,controller".
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      # The KAFKA_CFG_CONTROLLER_LISTENER_NAMES environment variable is used to specify the listener names that will be used for the controller role. In this case, it is set to "CONTROLLER".
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # The KAFKA_CFG_LISTENERS environment variable is used to specify the listeners that the Kafka broker will use. In this case, it is set to "PLAINTEXT://:9092,CONTROLLER://:9093", which means that the broker will listen for plaintext connections on port 9092 and controller connections on port 9093.
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP environment variable is used to specify the security protocols that will be used for each listener. In this case, it is set to "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT", which means that both the plaintext and controller listeners will use the plaintext security protocol.
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      # The KAFKA_CFG_ADVERTISED_LISTENERS environment variable is used to specify the advertised listeners that will be used by clients to connect to the Kafka broker. In this case, it is set to "PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093", which means that clients will connect to the broker using the hostname "kafka" and the appropriate port for each listener.
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093

      # The KAFKA_CFG_BROKER_ID environment variable is used to specify the unique identifier for the Kafka broker. In this case, it is set to "1".
      KAFKA_CFG_BROKER_ID: 1

      # The KAFKA_CFG_CONTROLLER_QUORUM_VOTERS environment variable is used to specify the voters for the controller quorum. In this case, it is set to "1@kafka:9093", which means that the broker with ID 1 will be a voter for the controller quorum and will listen on port 9093.
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      
      # The KAFKA_CFG_NUM_PARTITIONS environment variable is used to specify the default number of partitions for topics created on the Kafka broker. In this case, it is set to "3", which means that any new topic created on this broker will have 3 partitions by default.
      KAFKA_CFG_NUM_PARTITIONS: 3

      # Allow unencrypted traffic to the Kafka broker. This is necessary for clients that do not support encryption, such as some older versions of Kafka clients.
      ALLOW_PLAINTEXT_LISTENER: 'yes'

      