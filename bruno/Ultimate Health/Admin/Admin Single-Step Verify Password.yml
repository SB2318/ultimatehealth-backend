info:
  name: Admin Single-Step Verify Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/admin/verifypassword"
  body:
    type: json
    data: |-
      {
        "email": "admin@example.com",
        "otp": "123456",
        "newPassword": "NewAdminPassword@123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
