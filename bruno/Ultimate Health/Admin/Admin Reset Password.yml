info:
  name: Admin Reset Password (Submit New Password)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/admin/reset-password"
  body:
    type: json
    data: |-
      {
        "resetToken": "<PASTE_RESET_TOKEN_HERE>",
        "newPassword": "NewAdminPassword@123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
