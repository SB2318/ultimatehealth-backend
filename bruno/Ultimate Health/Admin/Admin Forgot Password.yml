info:
  name: Admin Forgot Password (Send OTP)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/admin/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "admin@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
